[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vshield"
version = "1.1.0"
description = "vShield v1.1 — Universal Vulnerability Detection, Monitoring & Remediation Framework"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "vShield Security Team"}
]
dependencies = [
    "pyyaml>=6.0; extra == 'full'",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[project.scripts]
vshield = "vshield.cli:main"
vulnshield = "vshield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
